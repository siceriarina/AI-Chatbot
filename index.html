<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">🤖</div>
            <div>
                <h1>\Mochi</h1>
                <p>Teman ngobrol anti-gabut🤣</p>
            </div>
        </header>

        <main id="chat-box">

            <div class="message ai-message">
               <div class="avatar">🍡</div>

                <div class="bubble">
                    Halo! 👋<br>
                    Aku Mochi. Ada yang mau kamu tanyakan?
                </div>
            </div>

        </main>

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Tulis pesan kamu..."
                autocomplete="off"
            >

            <button id="send-button">
                Kirim
            </button>

        </div>

        <p class="footer">
            Simple AI • Dibuat dengan ❤️
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
