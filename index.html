<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi GEMESS 🍡</title>

<link rel="stylesheet" href="style.css">

</head> <body>
<div class="container">

    <!-- HEADER -->
    <header>
        <div class="logo">🍡</div>

        <div>
            <h1>Mochi</h1>
            <p>Teman ngobrol anti-gabut 🤣</p>
        </div>
    </header>


    <!-- CHAT -->
    <main id="chat-box">

        <div class="message ai-message">

            <div class="avatar">🍡</div>

            <div class="bubble">
                Halo! 👋🍡<br>
                Mochi lagi bangun dulu... 🥱
            </div>

        </div>

    </main>


    <!-- INPUT -->
    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Tunggu Mochi bangun..."
            autocomplete="off"
            disabled
        >

        <button
            id="send-button"
            disabled
        >
            Tunggu...
        </button>

    </div>


    <!-- FOOTER -->
    <p class="footer">
        Mochi IMOET • Dibuat dengan ❤️
    </p>

</div>


<!-- JAVASCRIPT -->
<script
    type="module"
    src="script.js"
></script>

</body> </html>
